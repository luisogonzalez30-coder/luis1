<title>Gracias Atelier Crema</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Jost:wght@300..700&display=swap">
<style>
:root{
  /* Concepto: el mismo teatro oscuro de la tienda; aquí el momento es celebrar y tranquilizar. Oro champagne, un solo cobre vivo. */
  --bg:#0c0806;--bg2:#140e0b;--card:#1a130f;--line:rgba(216,178,110,.22);
  --fg:#f6ede1;--mut:#b9a995;--gold:#d8b26e;--gold2:#f3dca4;--ink:#1a1009;--ok:#9fd8a4;
  --f-d:'Bodoni Moda','Didot',Georgia,serif;--f-b:'Jost','Helvetica Neue',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--f-b);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--f-d);font-weight:500;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-top:calc(24px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:var(--f-d);font-size:1.2rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;text-decoration:none;color:var(--fg)}
.logo b{color:var(--gold);font-weight:600}
.lang{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:.82rem;color:var(--fg);cursor:pointer}
.lang option{background:var(--bg2)}
.hero{position:relative;text-align:center;padding-block:clamp(40px,8vw,90px) clamp(32px,5vw,56px);display:grid;justify-items:center;gap:22px}
.hero::before{content:"";position:absolute;width:700px;height:700px;left:50%;top:-120px;transform:translateX(-50%);background:radial-gradient(circle,rgba(216,178,110,.2),transparent 65%);pointer-events:none;max-width:100vw}
.seal{position:relative;width:96px;height:96px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;background:radial-gradient(circle,rgba(216,178,110,.18),transparent 70%);animation:pop .9s cubic-bezier(.2,1.4,.3,1) both}
.seal svg{width:44px;height:44px;stroke:var(--gold2);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .8s .5s ease forwards}
.seal::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--line);animation:ring 2.6s ease-out infinite}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{from{transform:scale(.9);opacity:.8}to{transform:scale(1.5);opacity:0}}
.eyebrow{font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:500}
h1{font-size:clamp(2.5rem,7vw,5rem);position:relative}
h1 em{font-style:italic;background:linear-gradient(100deg,var(--gold) 20%,var(--gold2) 45%,var(--gold) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:-220% 0}}
.lead{color:var(--mut);font-size:clamp(1.05rem,1.6vw,1.25rem);max-width:560px;position:relative}
.receipt{display:inline-flex;gap:10px;align-items:center;border:1px solid rgba(159,216,164,.4);background:rgba(159,216,164,.07);color:var(--ok);border-radius:999px;padding:8px 18px;font-size:.88rem}
.receipt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
section{padding-block:clamp(36px,6vw,72px)}
.sec-h{font-size:clamp(1.8rem,3.6vw,2.8rem);margin-bottom:28px;text-align:center}
.steps{display:grid;gap:18px}
@media(min-width:800px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;display:grid;gap:10px;position:relative}
.step b{font:italic 500 2.8rem/1 var(--f-d);color:var(--gold)}
.step h3{font-size:1.45rem}
.step p{color:var(--mut);font-size:.97rem}
.step.done{border-color:rgba(159,216,164,.45)}
.step.done b{color:var(--ok)}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:800px){.gallery{grid-template-columns:repeat(4,1fr)}}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;border:1px solid var(--line)}
.cols{display:grid;gap:18px}
@media(min-width:800px){.cols{grid-template-columns:1fr 1fr}}
.box{border:1px solid var(--line);border-radius:24px;padding:30px;background:var(--bg2);display:grid;gap:14px;align-content:start}
.box h3{font-size:1.6rem}
.box p{color:var(--mut)}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;font:600 1rem var(--f-b);letter-spacing:.04em;border-radius:999px;padding:16px 30px;background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,#b78a42);color:var(--ink);box-shadow:0 10px 40px -10px rgba(216,178,110,.55);transition:transform .25s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold2)}
.row{display:flex;flex-wrap:wrap;gap:12px}
footer{border-top:1px solid var(--line);padding-block:36px;margin-top:24px;color:var(--mut);font-size:.88rem;text-align:center}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none;width:100%;height:100%}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.seal svg{stroke-dashoffset:0}}
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top"><a class="logo" id="logo" href="#">Atelier <b>Crema</b></a>
    <select class="lang" id="lang" aria-label="Language"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option></select></div>

  <header class="hero">
    <div class="seal"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <span class="eyebrow" data-i="eyebrow"></span>
    <h1 data-h="title"></h1>
    <p class="lead" data-i="lead"></p>
    <span class="receipt" data-i="receipt"></span>
  </header>

  <section>
    <h2 class="sec-h" data-i="next"></h2>
    <div class="steps">
      <div class="step done"><b>1</b><h3 data-i="s1t"></h3><p data-i="s1p"></p></div>
      <div class="step"><b>2</b><h3 data-i="s2t"></h3><p data-i="s2p"></p></div>
      <div class="step"><b>3</b><h3 data-i="s3t"></h3><p data-i="s3p"></p></div>
    </div>
  </section>

  <section style="padding-top:0">
    <div class="gallery"><img src="img/pen-heart.jpg" alt=""><img src="img/mach-cafe.jpg" alt=""><img src="img/mach-verde.jpg" alt=""><img src="img/mach-rosa.jpg" alt=""></div>
  </section>

  <section style="padding-top:0">
    <div class="cols">
      <div class="box"><h3 data-i="helpT"></h3><p data-i="helpP"></p><div class="row"><a class="btn" id="wa" href="#" target="_blank" rel="noopener" hidden data-i="wa"></a></div></div>
      <div class="box"><h3 data-i="shareT"></h3><p data-i="shareP"></p><div class="row"><a class="btn ghost" id="store" href="#" data-i="back"></a></div></div>
    </div>
  </section>
  <footer><span data-i="foot"></span></footer>
</div>

<script>
/* ===== CONFIGURACIÓN ===== */
const CONFIG = {
  storeUrl: '',        // URL pública de la tienda para el botón "Volver a la tienda"
  whatsapp: ''         // Número internacional sin +, ej. 56912345678
};
const L = {
es:{eyebrow:"Pedido confirmado",title:"Gracias. Tu café ya tiene <em>firma propia.</em>",lead:"Recibimos tu pago. En breve te llega la confirmación por correo y empezamos a preparar tu pedido.",receipt:"Guarda el comprobante de PayPal que llegó a tu correo",next:"Qué pasa ahora",s1t:"Pago confirmado",s1p:"Tu pago en dólares (USD) quedó registrado.",s2t:"Preparamos tu pedido",s2p:"Lo despachamos en 24 a 48 horas.",s3t:"Te enviamos el seguimiento",s3p:"Recibirás el número de seguimiento en tu correo. El tiempo de entrega depende de tu país.",helpT:"¿Necesitas ayuda?",helpP:"Si cambiaste de color, de dirección o tienes una duda, escríbenos y lo resolvemos antes del despacho.",wa:"Escribir por WhatsApp",shareT:"Muestra tu primer latte",shareP:"Dibújalo, grábalo en 10 segundos y compártelo. Tu café ya es contenido.",back:"Volver a la tienda",foot:"Tienes 30 días de garantía. Todos los precios en dólares estadounidenses (USD)."},
en:{eyebrow:"Order confirmed",title:"Thank you. Your coffee now has <em>its own signature.</em>",lead:"We received your payment. A confirmation email is on its way and we're starting to prepare your order.",receipt:"Keep the PayPal receipt that reached your inbox",next:"What happens next",s1t:"Payment confirmed",s1p:"Your payment in US dollars (USD) is on record.",s2t:"We prepare your order",s2p:"We ship it within 24 to 48 hours.",s3t:"We send your tracking",s3p:"You'll get the tracking number by email. Delivery time depends on your country.",helpT:"Need help?",helpP:"If you want to change a color or address, or have a question, message us and we'll sort it out before shipping.",wa:"Message us on WhatsApp",shareT:"Show off your first latte",shareP:"Draw it, film it in 10 seconds and share it. Your coffee is now content.",back:"Back to the store",foot:"You have a 30-day guarantee. All prices in US dollars (USD)."},
pt:{eyebrow:"Pedido confirmado",title:"Obrigado. Seu café agora tem <em>assinatura própria.</em>",lead:"Recebemos seu pagamento. Em breve chega a confirmação por e-mail e começamos a preparar seu pedido.",receipt:"Guarde o comprovante do PayPal que chegou ao seu e-mail",next:"O que acontece agora",s1t:"Pagamento confirmado",s1p:"Seu pagamento em dólares (USD) foi registrado.",s2t:"Preparamos seu pedido",s2p:"Enviamos em 24 a 48 horas.",s3t:"Enviamos o rastreio",s3p:"Você receberá o código de rastreio por e-mail. O prazo de entrega depende do seu país.",helpT:"Precisa de ajuda?",helpP:"Se quiser trocar a cor ou o endereço, ou tiver uma dúvida, fale conosco e resolvemos antes do envio.",wa:"Falar no WhatsApp",shareT:"Mostre seu primeiro latte",shareP:"Desenhe, grave em 10 segundos e compartilhe. Seu café agora é conteúdo.",back:"Voltar à loja",foot:"Você tem 30 dias de garantia. Todos os preços em dólares americanos (USD)."},
fr:{eyebrow:"Commande confirmée",title:"Merci. Votre café a maintenant <em>sa propre signature.</em>",lead:"Nous avons reçu votre paiement. Un e-mail de confirmation arrive et nous préparons votre commande.",receipt:"Conservez le reçu PayPal arrivé dans votre boîte mail",next:"Et maintenant",s1t:"Paiement confirmé",s1p:"Votre paiement en dollars (USD) est enregistré.",s2t:"Nous préparons votre commande",s2p:"Expédition sous 24 à 48 heures.",s3t:"Nous envoyons le suivi",s3p:"Vous recevrez le numéro de suivi par e-mail. Le délai dépend de votre pays.",helpT:"Besoin d'aide ?",helpP:"Pour changer une couleur ou une adresse, ou pour une question, écrivez-nous et nous réglons cela avant l'expédition.",wa:"Écrire sur WhatsApp",shareT:"Montrez votre premier latte",shareP:"Dessinez-le, filmez-le en 10 secondes et partagez. Votre café devient un contenu.",back:"Retour à la boutique",foot:"Vous avez 30 jours de garantie. Tous les prix sont en dollars américains (USD)."},
de:{eyebrow:"Bestellung bestätigt",title:"Danke. Dein Kaffee hat jetzt <em>seine eigene Signatur.</em>",lead:"Wir haben deine Zahlung erhalten. Eine Bestätigung kommt per E-Mail und wir bereiten deine Bestellung vor.",receipt:"Bewahre den PayPal-Beleg aus deinem Postfach auf",next:"Wie es weitergeht",s1t:"Zahlung bestätigt",s1p:"Deine Zahlung in US-Dollar (USD) ist verbucht.",s2t:"Wir bereiten deine Bestellung vor",s2p:"Versand innerhalb von 24 bis 48 Stunden.",s3t:"Wir senden die Sendungsnummer",s3p:"Die Sendungsnummer kommt per E-Mail. Die Lieferzeit hängt von deinem Land ab.",helpT:"Brauchst du Hilfe?",helpP:"Willst du eine Farbe oder Adresse ändern oder hast eine Frage, schreib uns, wir klären es vor dem Versand.",wa:"Per WhatsApp schreiben",shareT:"Zeig deinen ersten Latte",shareP:"Zeichne ihn, filme ihn in 10 Sekunden und teile ihn. Dein Kaffee ist jetzt Content.",back:"Zurück zum Shop",foot:"Du hast 30 Tage Garantie. Alle Preise in US-Dollar (USD)."},
it:{eyebrow:"Ordine confermato",title:"Grazie. Il tuo caffè ora ha <em>una firma tutta sua.</em>",lead:"Abbiamo ricevuto il pagamento. Ti arriva a breve la conferma via e-mail e iniziamo a preparare l'ordine.",receipt:"Conserva la ricevuta PayPal arrivata nella tua e-mail",next:"Cosa succede ora",s1t:"Pagamento confermato",s1p:"Il tuo pagamento in dollari (USD) è registrato.",s2t:"Prepariamo il tuo ordine",s2p:"Spediamo entro 24-48 ore.",s3t:"Ti inviamo il tracking",s3p:"Riceverai il numero di tracking via e-mail. I tempi di consegna dipendono dal tuo paese.",helpT:"Serve aiuto?",helpP:"Se vuoi cambiare colore o indirizzo, o hai un dubbio, scrivici e lo risolviamo prima della spedizione.",wa:"Scrivici su WhatsApp",shareT:"Mostra il tuo primo latte",shareP:"Disegnalo, registralo in 10 secondi e condividilo. Il tuo caffè ora è contenuto.",back:"Torna al negozio",foot:"Hai 30 giorni di garanzia. Tutti i prezzi in dollari statunitensi (USD)."}
};
const CC={};'ES MX AR CL CO PE VE EC GT CU BO DO HN PY SV NI CR PA UY PR GQ'.split(' ').forEach(c=>CC[c]='es');'BR PT AO MZ CV'.split(' ').forEach(c=>CC[c]='pt');'FR BE LU MC SN CI CM HT'.split(' ').forEach(c=>CC[c]='fr');'DE AT LI CH'.split(' ').forEach(c=>CC[c]='de');'IT SM VA'.split(' ').forEach(c=>CC[c]='it');
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=s=>document.querySelector(s);let lang='en';
function apply(){
  document.documentElement.lang=lang;$('#lang').value=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=L[lang][e.dataset.i]);
  document.querySelectorAll('[data-h]').forEach(e=>e.innerHTML=L[lang][e.dataset.h]);
  $('#wa').hidden=!CONFIG.whatsapp;if(CONFIG.whatsapp)$('#wa').href='https://wa.me/'+CONFIG.whatsapp;
  $('#store').href=CONFIG.storeUrl||'#';$('#logo').href=CONFIG.storeUrl||'#';
  $('#store').hidden=!CONFIG.storeUrl;
}
$('#lang').onchange=e=>{lang=e.target.value;ls.set('ac_lang',lang);apply()};
async function ipCountry(){for(const [u,k] of [['https://ipapi.co/json/','country_code'],['https://ipwho.is/','country_code']]){try{const c=new AbortController();const t=setTimeout(()=>c.abort(),2500);const r=await fetch(u,{signal:c.signal});clearTimeout(t);const j=await r.json();if(j&&j[k])return String(j[k]).toUpperCase()}catch(e){}}return null}
(function(){const s=ls.get('ac_lang');const b=((navigator.languages&&navigator.languages[0])||navigator.language||'en').slice(0,2).toLowerCase();lang=(s&&L[s])?s:(L[b]?b:'en');apply();
  if(!s)ipCountry().then(cc=>{if(!cc)return;const l=CC[cc]||'en';if(l!==lang){lang=l;apply()}})})();

/* Lluvia de granos de café al cargar */
const cv=$('#fx'),cx=cv.getContext('2d');let beans=[],raf=0,w=0,h=0;
function fit(){w=innerWidth;h=innerHeight;cv.width=w*devicePixelRatio;cv.height=h*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}fit();addEventListener('resize',fit);
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
  for(let i=0;i<70;i++)beans.push({x:Math.random()*w,y:-20-Math.random()*h*.8,vy:2+Math.random()*3,vx:(Math.random()-.5)*1.2,r:Math.random()*6,vr:(Math.random()-.5)*.1,c:['#5a3520','#7a4a2a','#d8b26e','#3b2214'][i%4],s:.7+Math.random()*.7});
  (function loop(){cx.clearRect(0,0,w,h);beans=beans.filter(b=>b.y<h+30);beans.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.r+=b.vr;cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.scale(b.s,b.s);cx.fillStyle=b.c;cx.beginPath();cx.ellipse(0,0,8,5,0,0,7);cx.fill();cx.strokeStyle='rgba(0,0,0,.45)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(-6,0);cx.quadraticCurveTo(0,-2.5,6,0);cx.stroke();cx.restore()});if(beans.length)requestAnimationFrame(loop)})();
}
/* Aquí va el evento de compra de tu píxel (Meta/TikTok), por ejemplo: fbq('track','Purchase'); */
</script>
