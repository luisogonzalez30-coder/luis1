<title>Atelier Crema</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Jost:wght@300..700&display=swap">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  /* Concepto: teatro oscuro de cafetería de autor. Columnas de fotos en movimiento, oro champagne como acento y un único cobre vivo reservado a la urgencia. */
  --bg:#0c0806; --bg2:#140e0b; --card:#1a130f; --line:rgba(216,178,110,.22);
  --fg:#f6ede1; --mut:#b9a995; --gold:#d8b26e; --gold2:#f3dca4; --hot:#ee6c3c; --ink:#1a1009;
  --f-d:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --f-b:'Jost','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--f-b);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
img{display:block;max-width:100%}
a{color:inherit}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
h1,h2,h3{font-family:var(--f-d);font-weight:500;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1 em,h2 em{font-style:italic;background:linear-gradient(100deg,var(--gold) 20%,var(--gold2) 45%,var(--gold) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:-220% 0}}
p{margin:0;text-wrap:pretty}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:clamp(64px,9vw,120px)}
.eyebrow{font-size:.74rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:500}
.sec-head{display:grid;gap:14px;max-width:760px;margin-bottom:clamp(32px,5vw,56px)}
.sec-head h2{font-size:clamp(2rem,4.6vw,3.6rem)}
.sec-head p{color:var(--mut);font-size:1.08rem}
.rv{opacity:.15;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
html:not(.js) .rv{opacity:1;transform:none}

/* Barra de anuncios */
.ticker{background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));color:var(--ink);overflow:hidden;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding-top:env(safe-area-inset-top,0px)}
.ticker-track{display:flex;width:max-content;animation:slide 32s linear infinite}
.ticker-track span{padding:10px 28px;white-space:nowrap}
.ticker-track span::after{content:"◆";margin-left:56px;opacity:.5}
@keyframes slide{to{transform:translateX(-50%)}}

/* Navegación */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:68px}
.logo{font-family:var(--f-d);font-size:1.35rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;font-weight:600;white-space:nowrap}
.logo b{color:var(--gold);font-weight:600}
.nav-links{display:none;gap:28px;margin-left:auto;font-size:.88rem;letter-spacing:.06em}
.nav-links a{text-decoration:none;color:var(--mut);transition:color .2s}
.nav-links a:hover{color:var(--gold2)}
.nav-r{display:flex;gap:10px;align-items:center;margin-left:auto}
.lang{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.82rem;cursor:pointer;color:var(--fg)}
.lang option{background:var(--bg2);color:var(--fg)}
.cartbtn{position:relative;display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:.86rem;font-weight:500;transition:background .25s,color .25s}
.cartbtn:hover{background:var(--gold);color:var(--ink)}
.cartbtn i{font-style:normal;min-width:20px;height:20px;border-radius:50%;background:var(--hot);color:#fff;font-size:.72rem;display:grid;place-items:center;font-weight:600}
@media(max-width:560px){.nav .wrap{gap:8px}.logo{font-size:1rem;letter-spacing:.08em}.cartbtn span{display:none}.cartbtn{padding:8px 12px}.lang{padding:8px 10px;font-size:.78rem}.nav-r{gap:6px}}
@media(min-width:900px){.nav-links{display:flex}.nav-r{margin-left:0}}

/* Botones */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:17px 34px;font-size:1rem;background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,#b78a42);color:var(--ink);transition:transform .25s,box-shadow .25s;box-shadow:0 10px 40px -10px rgba(216,178,110,.55)}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 18px 50px -10px rgba(216,178,110,.75)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.2s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn.pulse{animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(238,108,60,.55),0 10px 40px -10px rgba(216,178,110,.55)}70%{box-shadow:0 0 0 18px rgba(238,108,60,0),0 10px 40px -10px rgba(216,178,110,.55)}100%{box-shadow:0 0 0 0 rgba(238,108,60,0),0 10px 40px -10px rgba(216,178,110,.55)}}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.ghost::after{display:none}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold2)}
.btn.block{width:100%}

/* Hero */
.hero{position:relative;padding-block:clamp(36px,6vw,80px) clamp(48px,7vw,96px);overflow:hidden}
.hero::before{content:"";position:absolute;width:760px;height:760px;right:-200px;top:-180px;background:radial-gradient(circle,rgba(216,178,110,.22),transparent 65%);pointer-events:none}
.hero-grid{display:grid;gap:40px;align-items:center;position:relative}
@media(min-width:960px){.hero-grid{grid-template-columns:1.05fr .95fr;gap:56px}}
.hero h1{font-size:clamp(2.7rem,7vw,5.6rem);margin:18px 0 22px}
.hero .lead{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--mut);max-width:520px}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);background:rgba(216,178,110,.06)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--hot);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.cta-row{display:flex;flex-wrap:wrap;gap:14px;margin:30px 0 28px}
.ends{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 20px;border:1px solid rgba(238,108,60,.4);background:rgba(238,108,60,.07);border-radius:18px;width:fit-content;max-width:100%}
.ends small{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:#f6b79d;max-width:210px;line-height:1.35}
.cd{display:flex;gap:10px}
.cdb{min-width:58px;text-align:center}
.cdb b{display:block;font:600 1.9rem/1 var(--f-d);font-variant-numeric:tabular-nums;color:var(--fg)}
.cdb span{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.trust{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:26px;font-size:.86rem;color:var(--mut)}
.trust span::before{content:"";display:inline-block;width:14px;height:8px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg) translateY(-3px);margin-right:10px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;height:clamp(420px,72vh,720px);overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);min-width:0}
.col{display:flex;flex-direction:column;gap:14px;animation:up 40s linear infinite;will-change:transform}
.col:nth-child(2){animation-direction:reverse;animation-duration:48s}
.col:nth-child(3){animation-duration:44s}
@keyframes up{to{transform:translateY(calc(-50% - 7px))}}
.col img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:18px;flex:none;border:1px solid var(--line)}

/* Marquesina de texto */
.big-marq{border-block:1px solid var(--line);overflow:hidden;padding-block:22px;background:var(--bg2)}
.big-track{display:flex;width:max-content;animation:slide 40s linear infinite}
.big-track span{font:italic 500 clamp(2rem,5vw,4rem)/1 var(--f-d);padding-inline:26px;white-space:nowrap;color:transparent;-webkit-text-stroke:1px var(--gold)}
.big-track span:nth-child(even){color:var(--gold);-webkit-text-stroke:0}

/* Productos */
.grid3{display:grid;gap:24px}
@media(min-width:760px){.grid3{grid-template-columns:repeat(3,1fr)}}
.pcard{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;transition:border-color .3s,box-shadow .4s;transform-style:preserve-3d;will-change:transform;min-width:0}
.pcard:hover{border-color:var(--gold);box-shadow:0 30px 80px -30px rgba(216,178,110,.4)}
.pimg{position:relative;aspect-ratio:4/5;overflow:hidden;background:#000}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .7s,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.pimg img+img{opacity:0}
.pcard:hover .pimg img+img{opacity:1}
.pcard:hover .pimg img{transform:scale(1.07)}
.badge{position:absolute;top:16px;left:16px;z-index:2;background:var(--hot);color:#fff;font-weight:600;font-size:.82rem;letter-spacing:.04em;padding:6px 14px;border-radius:999px}
.tag{position:absolute;top:16px;right:16px;z-index:2;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(12,8,6,.7);backdrop-filter:blur(6px);color:var(--gold2);border:1px solid var(--line)}
.pbody{display:grid;gap:14px;padding:24px;flex:1;align-content:start}
.pbody h3{font-size:1.7rem}
.pbody .sub{color:var(--gold);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase}
.pbody p{color:var(--mut);font-size:.98rem}
.vars{display:flex;gap:8px;flex-wrap:wrap}
.vars button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:.86rem;color:var(--mut);transition:all .2s}
.vars button[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:var(--gold)}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price b{font:600 2rem/1 var(--f-d);font-variant-numeric:tabular-nums}
.price s{color:var(--mut);font-size:1rem;font-variant-numeric:tabular-nums}
.price em{font-style:normal;font-size:.7rem;letter-spacing:.14em;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.stock{display:grid;gap:6px;font-size:.8rem;color:#f6b79d}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--hot),#ffb27a);transition:width 1.4s cubic-bezier(.2,.7,.2,1)}

/* Historias */
.story{display:grid;gap:36px;align-items:center;margin-bottom:clamp(56px,8vw,110px)}
.story:last-child{margin-bottom:0}
@media(min-width:900px){.story{grid-template-columns:1fr 1fr;gap:72px}.story.flip .story-img{order:2}}
.story-img{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:5/4;border:1px solid var(--line)}
.story-img img{position:absolute;left:0;top:-8%;width:100%;height:116%;object-fit:cover;will-change:transform}
.story-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(12,8,6,.55))}
.story h2{font-size:clamp(2rem,4.2vw,3.4rem);margin:14px 0 18px}
.story p{color:var(--mut);font-size:1.1rem;max-width:520px}
.ticks{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:12px}
.ticks li{display:flex;gap:14px;align-items:center;font-size:1rem}
.ticks li::before{content:"";flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);background:radial-gradient(circle,var(--gold) 0 3px,transparent 4px)}

/* Set */
.bundle-sec{background:radial-gradient(ellipse at top,rgba(216,178,110,.14),transparent 60%),var(--bg2)}
.bundle{position:relative;border-radius:34px;padding:2px;background:conic-gradient(from var(--a,0deg),var(--gold),#6b4a1f,var(--gold2),#6b4a1f,var(--gold));animation:spin 8s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.bundle-in{background:var(--bg);border-radius:32px;padding:clamp(24px,5vw,60px);display:grid;gap:36px;align-items:center}
@media(min-width:900px){.bundle-in{grid-template-columns:1.05fr .95fr}}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;border:1px solid var(--line)}
.thumbs img:nth-child(even){transform:translateY(22px)}
.bundle h2{font-size:clamp(2.1rem,4.6vw,3.8rem);margin:14px 0}
.bundle .inc{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 24px}
.bundle .inc span{font-size:.84rem;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--gold2)}
.bundle .price b{font-size:3rem}
.save{display:inline-block;margin:10px 0 24px;color:var(--ink);background:var(--gold2);font-weight:600;border-radius:999px;padding:6px 16px;font-size:.9rem}

/* Momentos */
.moments{padding-block:clamp(56px,7vw,90px);overflow:hidden}
.moments .sec-head{margin-inline:auto;text-align:center;justify-items:center}
.m-track{display:flex;gap:16px;width:max-content;animation:slide 70s linear infinite}
.m-track:hover{animation-play-state:paused}
.m-track img{width:clamp(200px,24vw,300px);aspect-ratio:3/4;object-fit:cover;border-radius:22px;border:1px solid var(--line);flex:none}

/* Pasos, garantías */
.steps{display:grid;gap:20px}
@media(min-width:800px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{border-top:1px solid var(--gold);padding-top:22px;display:grid;gap:10px}
.step b{font:italic 500 3.4rem/1 var(--f-d);color:var(--gold)}
.step h3{font-size:1.5rem}
.step p{color:var(--mut)}
.guar{display:grid;gap:18px}
@media(min-width:800px){.guar{grid-template-columns:repeat(3,1fr)}}
.gbox{border:1px solid var(--line);border-radius:22px;padding:28px;background:var(--card);display:grid;gap:8px}
.gbox h3{font:600 1.2rem var(--f-b);letter-spacing:.02em;color:var(--gold2)}
.gbox p{color:var(--mut);font-size:.96rem}

/* FAQ */
.faq{max-width:820px;display:grid;gap:12px}
details{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
summary{list-style:none;cursor:pointer;padding:20px 24px;font-weight:500;font-size:1.05rem;display:flex;justify-content:space-between;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:300 1.8rem/1 var(--f-b);color:var(--gold);transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 24px 22px;color:var(--mut)}

/* CTA final */
.final{position:relative;text-align:center;overflow:hidden;isolation:isolate}
.final>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.final::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,var(--bg),rgba(12,8,6,.78) 30%,rgba(12,8,6,.78) 70%,var(--bg))}
.final h2{font-size:clamp(2.4rem,6vw,5rem);max-width:900px;margin-inline:auto}
.final p{color:var(--mut);font-size:1.15rem;margin:18px auto 32px;max-width:560px}
.final .ends{margin:0 auto 32px}
footer{border-top:1px solid var(--line);padding-block:40px calc(40px + 70px);color:var(--mut);font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:center}

/* Carrito */
.veil{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .35s}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:80;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg2);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.d-head h3{font-size:1.6rem}
.x{background:transparent;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1.1rem;line-height:1}
.goal{padding:16px 24px;border-bottom:1px solid var(--line);font-size:.86rem;display:grid;gap:8px;color:var(--gold2)}
.goal .bar i{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.d-body{flex:1;overflow:auto;padding:12px 24px;display:grid;align-content:start}
.empty{color:var(--mut);padding:40px 0;text-align:center}
.line{display:grid;grid-template-columns:74px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.line img{width:74px;height:74px;border-radius:14px;object-fit:cover}
.line h4{margin:0 0 2px;font:500 1rem var(--f-b)}
.line small{color:var(--mut)}
.qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer}
.line .lp{font-weight:600;font-variant-numeric:tabular-nums}
.d-foot{padding:20px 24px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--bg)}
.row{display:flex;justify-content:space-between;color:var(--mut);font-size:.94rem;font-variant-numeric:tabular-nums}
.row.tot{color:var(--fg);font:600 1.5rem var(--f-d)}
.row.dsc{color:#9fd8a4}
.note{font-size:.8rem;color:#f6b79d;text-align:center}

/* Pop-up, sticky, toast */
.pop{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
.pop.on{opacity:1;pointer-events:auto}
.pop-card{position:relative;width:min(480px,100%);background:var(--bg2);border:1px solid var(--gold);border-radius:28px;padding:40px 30px 30px;text-align:center;display:grid;gap:14px;transform:scale(.92);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.pop.on .pop-card{transform:none}
.pop-card .x{position:absolute;top:14px;right:14px}
.pop-card h3{font-size:2.3rem}
.pop-card p{color:var(--mut)}
.code{font:600 1.5rem/1 var(--f-b);letter-spacing:.3em;border:1px dashed var(--gold);border-radius:14px;padding:16px;color:var(--gold2)}
.skip{background:none;border:0;color:var(--mut);cursor:pointer;text-decoration:underline;font-size:.86rem}
.sticky{position:fixed;z-index:55;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(12,8,6,.92);backdrop-filter:blur(14px);border-top:1px solid var(--gold);transform:translateY(110%);transition:transform .45s}
.sticky.on{transform:none}
.sticky small{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sticky b{font:600 1.4rem/1 var(--f-d)}
.sticky .btn{padding:14px 24px;font-size:.92rem}
.toast{position:fixed;z-index:100;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--gold2);color:var(--ink);font-weight:600;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:all .4s;max-width:calc(100% - 32px);text-align:center;font-size:.92rem}
.toast.on{opacity:1;transform:translate(-50%,0)}

async function ipCountry(){
  const urls=[['https://ipapi.co/json/','country_code'],['https://ipwho.is/','country_code']];
  for(const [u,k] of urls){
    try{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),2500);
      const r=await fetch(u,{signal:c.signal}); clearTimeout(t); const j=await r.json(); if(j&&j[k]) return String(j[k]).toUpperCase(); }catch(e){}
  } return null;
}

function renderProducts(){
  const card=(id,nameK,subK,descK)=>{
    const p=P[id]; const imgs = id==='key'? p.v[varSel.key] : p.img;
    const vars = id==='key' ? `<div class="vars" role="group">${['mach','cup'].map(v=>`<button type="button" data-var="${v}" aria-pressed="${varSel.key===v}">${t('v_'+v)}</button>`).join('')}</div>` : '';
    return `<article class="pcard tilt rv in" data-id="${id}">
      <div class="pimg"><span class="badge">-${pct(p)}%</span><span class="tag">${t('tagl')}</span>
        <img src="img/${imgs[0]}.jpg" alt="${t(nameK)}" loading="lazy"><img src="img/${imgs[1]}.jpg" alt="" loading="lazy"></div>
      <div class="pbody"><span class="sub">${t(subK)}</span><h3>${t(nameK)}</h3><p>${t(descK)}</p>${vars}
        <div class="price"><b>${fmt(p.price)}</b><s>${fmt(p.was)}</s><em>USD</em></div>
        <div class="stock">${stockHtml(id)}</div>
        <button class="btn block" type="button" data-add="${id}">${t('add')}</button></div></article>`;
  };
  $('#pgrid').innerHTML = card('pen','pen_n','pen_t','pen_d')+card('drip','drip_n','drip_t','drip_d')+card('key','key_n','key_t','key_d');
}
function renderBundle(){
  $('#inc').innerHTML = [t('pen_n'),t('drip_n'),t('key_n')+' · '+t('v_mach'),t('key_n')+' · '+t('v_cup')].map(x=>`<span>${x}</span>`).join('');
  $('#bprice').innerHTML = `<b>${fmt(P.set.price)}</b><s>${fmt(SET_REF)}</s><em>USD</em>`;
  $('#bsave').textContent = t('b_save',{x:fmt(SET_REF-P.set.price)});
  $('#bstock').innerHTML = stockHtml('set');
  $('#stickyP').textContent = fmt(P.set.price);
}
function lineInfo(i){
  if(i.id==='set') return {name:'Atelier Set', sub:[t('pen_n'),t('drip_n'),t('key_n')].join(' + '), img:'pen-flower'};
  if(i.id==='key') return {name:t('key_n'), sub:t('v_'+i.v), img:P.key.v[i.v][0]};
  return {name:t(i.id+'_n'), sub:'', img:P[i.id].img[0]};
}
function totals(){
  const sub = cart.reduce((a,i)=>a+P[i.id].price*i.qty,0);
  const d = discount ? sub*CONFIG.discountPct/100 : 0;
  return {sub, d, tot: sub-d};
}
function renderCart(){
  const n = cart.reduce((a,i)=>a+i.qty,0); $('#cartN').textContent=n;
  const body=$('#dbody');
  body.innerHTML = cart.length ? cart.map((i,ix)=>{ const L=lineInfo(i); return `<div class="line"><img src="img/${L.img}.jpg" alt=""><div><h4>${L.name}</h4><small>${L.sub}</small><div class="qty"><button type="button" data-q="${ix}" data-d="-1" aria-label="-">−</button><span>${i.qty}</span><button type="button" data-q="${ix}" data-d="1" aria-label="+">+</button></div></div><div class="lp">${fmt(P[i.id].price*i.qty)}</div></div>` }).join('') : `<div class="empty">${t('c_empty')}</div>`;
  const T=totals(); const left=Math.max(0,CONFIG.freeShipFrom-T.sub);
  $('#cSub').textContent=fmt(T.sub);
  $('#cDiscRow').hidden = !(discount && cart.length);
  $('#cDiscL').textContent=t('c_disc',{c:CONFIG.discountCode,p:CONFIG.discountPct}); $('#cDisc').textContent='−'+fmt(T.d);
  $('#cTot').textContent=fmt(T.tot);
  const free = T.sub>=CONFIG.freeShipFrom && cart.length;
  $('#cShip').textContent = cart.length ? (free ? t('c_free') : t('c_calc')) : '—';
  $('#goalTxt').textContent = free ? t('c_goal_ok') : t('c_goal',{x:fmt(left)});
  $('#goalBar').style.width = Math.min(100,T.sub/CONFIG.freeShipFrom*100)+'%';
  const go=$('#go'), note=$('#goNote'); let url='';
  const text = `Atelier Crema\n`+cart.map(i=>{const L=lineInfo(i);return `${i.qty}x ${L.name}${L.sub&&i.id!=='set'?' ('+L.sub+')':''}`}).join('\n')+`\nTotal: ${fmt(T.tot)} USD`+(discount?`\nCode: ${CONFIG.discountCode}`:'');
  if(CONFIG.whatsapp) url='https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(text); else if(CONFIG.checkoutUrl) url=CONFIG.checkoutUrl;
  go.dataset.url=url; go.setAttribute('href',url||'#');
  go.style.opacity = cart.length?1:.45; go.style.pointerEvents = cart.length?'auto':'none';
  note.hidden = !!url || !cart.length; note.textContent=t('c_cfg');
  ls.set('ac_cart',JSON.stringify(cart));
}
function add(id,v){
  const vv = id==='key' ? (v||varSel.key) : null;
  const ex = cart.find(i=>i.id===id && i.v===vv);
  if(ex) ex.qty++; else cart.push(vv?{id,v:vv,qty:1}:{id,qty:1});
  renderCart(); toast(t('t_add'));
}
$('#go').addEventListener('click',e=>{ if(!$('#go').dataset.url){ e.preventDefault(); $('#goNote').hidden=false } });

/* ========== INTERACCIONES ========== */
function openCart(){ $('#drawer').classList.add('on'); $('#veil').classList.add('on') }
function closeCart(){ $('#drawer').classList.remove('on'); $('#veil').classList.remove('on') }
$('#openCart').onclick=openCart; $('#closeCart').onclick=closeCart; $('#veil').onclick=closeCart;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeCart(); closePop() } });
$('#lang').onchange=e=>{ lang=e.target.value; ls.set('ac_lang',lang); applyI18n() };
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-add]'); if(a){ add(a.dataset.add); burst(e.clientX,e.clientY); setTimeout(openCart,450); return }
  const s=e.target.closest('[data-addset]'); if(s){ add('set'); burst(e.clientX,e.clientY); setTimeout(openCart,450); return }
  const v=e.target.closest('[data-var]'); if(v){ varSel.key=v.dataset.var; const c=v.closest('.pcard'); $$('[data-var]',c).forEach(b=>b.setAttribute('aria-pressed',b===v)); const im=$$('.pimg img',c); P.key.v[varSel.key].forEach((n,i)=>{ im[i].src='img/'+n+'.jpg' }); return }
  const q=e.target.closest('[data-q]'); if(q){ const i=cart[+q.dataset.q]; i.qty+=+q.dataset.d; if(i.qty<1) cart.splice(+q.dataset.q,1); renderCart() }
});

function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200) }

/* Cuenta regresiva hasta la medianoche local */
function tick(){
  const n=new Date(), end=new Date(n); end.setHours(24,0,0,0); let s=Math.max(0,Math.floor((end-n)/1000));
  const h=String(Math.floor(s/3600)).padStart(2,'0'), m=String(Math.floor(s%3600/60)).padStart(2,'0'), x=String(s%60).padStart(2,'0');
  $$('[data-cd]').forEach(c=>{ $('[data-h]',c).textContent=h; $('[data-m]',c).textContent=m; $('[data-s]',c).textContent=x });
}
setInterval(tick,1000);

/* Pop-up de salida */
function showPop(){ if(ss.get('ac_pop')||discount) return; ss.set('ac_pop','1'); $('#pop').classList.add('on') }
function closePop(){ $('#pop').classList.remove('on') }
$('#popX').onclick=closePop; $('#popNo').onclick=closePop; $('#pop').addEventListener('click',e=>{ if(e.target.id==='pop') closePop() });
$('#popGo').onclick=()=>{ discount=true; ls.set('ac_code',CONFIG.discountCode); closePop(); renderCart(); toast(t('t_code')); setTimeout(openCart,500) };
document.addEventListener('mouseout',e=>{ if(!e.relatedTarget && e.clientY<=0) showPop() });
setTimeout(showPop,38000);

/* Barra fija móvil */
const hero=$('.hero');
function onScroll(){
  const y=scrollY; $('#sticky').classList.toggle('on', y>hero.offsetHeight*.7);
  $$('[data-par]').forEach(im=>{ const r=im.parentElement.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight) return; const k=(r.top+r.height/2-innerHeight/2)/innerHeight; im.style.transform=`translateY(${(k*-7).toFixed(2)}%)` });
}
addEventListener('scroll',()=>requestAnimationFrame(onScroll),{passive:true}); onScroll();

/* Revelado al hacer scroll */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target) } }),{threshold:.12}) : null;
$$('.rv').forEach(e=>{ io ? io.observe(e) : e.classList.add('in') });
setTimeout(()=>$$('.rv').forEach(e=>e.classList.add('in')),6000);

/* Inclinación 3D de tarjetas (solo puntero fino) */
if(matchMedia('(hover:hover) and (pointer:fine)').matches && !matchMedia('(prefers-reduced-motion:reduce)').matches){
  document.addEventListener('pointermove',e=>{
    const g=$('#glow'); g.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;
    const c=e.target.closest&&e.target.closest('.tilt');
    $$('.tilt').forEach(x=>{ if(x!==c) x.style.transform='' });
    if(c){ const r=c.getBoundingClientRect(), px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5; c.style.transform=`perspective(1000px) rotateY(${px*7}deg) rotateX(${-py*7}deg) translateY(-4px)` }
  });
}

/* Granos de café al agregar */
const cv=$('#fx'), cx=cv.getContext('2d'); let beans=[], raf=0;
function fit(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0) }
fit(); addEventListener('resize',fit);
function burst(x,y){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  for(let i=0;i<30;i++){ const a=Math.random()*Math.PI*2, s=4+Math.random()*7; beans.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1,c:['#5a3520','#7a4a2a','#d8b26e','#3b2214'][i%4]}) }
  if(!raf) raf=requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  beans=beans.filter(b=>b.l>0);
  beans.forEach(b=>{ b.x+=b.vx; b.y+=b.vy; b.vy+=.38; b.vx*=.985; b.r+=b.vr; b.l-=.014; cx.save(); cx.globalAlpha=Math.max(0,b.l); cx.translate(b.x,b.y); cx.rotate(b.r); cx.fillStyle=b.c; cx.beginPath(); cx.ellipse(0,0,8,5,0,0,7); cx.fill(); cx.strokeStyle='rgba(0,0,0,.45)'; cx.lineWidth=1.2; cx.beginPath(); cx.moveTo(-6,0); cx.quadraticCurveTo(0,-2.5,6,0); cx.stroke(); cx.restore() });
  raf = beans.length ? requestAnimationFrame(loop) : 0;
}

/* Galerías animadas */
const colSets=[['pen-flower','mach-hand','drip-balcony','cup-hand'],['mach-market','pen-heart','cup-press','drip-drop'],['cup-press','pen-feather','mach-pack','drip-flat']];

const words=['Latte Art','Pour Over','Barista','Signature','Mini Café','Crema'];
$('#bigTrack').innerHTML = [...words,...words,...words,...words].map(w=>`<span>${w}</span>`).join('');
const all=['pen-flower','mach-market','drip-balcony','cup-finger','pen-feather','mach-hand','drip-flat','cup-hand','pen-heart','drip-drop','mach-pack','cup-press'];
$('#mTrack').innerHTML = [...all,...all].map(n=>`<img src="img/${n}.jpg" alt="" loading="lazy">`).join('');

/* ========== ARRANQUE ========== */
(function(){
  const saved=ls.get('ac_lang');
  lang = (saved&&I18N[saved]) ? saved : browserLang();
  applyI18n();
  if(!saved){
    ipCountry().then(cc=>{
      if(!cc) return; const l=CC_LANG[cc]||'en';
      if(l!==lang){ lang=l; applyI18n(); toast(t('t_lang')) }
    });
  }
})();
