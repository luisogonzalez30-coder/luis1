<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: necesario para que env(safe-area-inset-bottom) valga
         algo y la barra inferior no quede bajo el indicador de gestos del iPhone.
         Se quitaron "maximum-scale=1.0, user-scalable=no": bloquear el zoom es
         una barrera de accesibilidad real (WCAG 1.4.4) para vecinos mayores o con
         baja visión, que son parte del público de esta app. El efecto secundario
         que esos flags evitaban —iOS hace zoom al enfocar un input de menos de
         16px— se resuelve con el tamaño de fuente de los campos, no capando el
         zoom de todos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D4ED8" />
    <title>TuMuniAquí</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TuMuniAquí" />

    <!-- Pantalla de carga propia: el splash nativo de la PWA (ícono + background_color
         del manifest) lo pinta el sistema operativo ANTES de que llegue este HTML, así
         que no se puede animar — es responsabilidad del navegador, no nuestra. Esto de
         acá SÍ es nuestro: aparece en cuanto el navegador procesa el <body>, sin esperar
         a que baje el bundle de React. Vive DENTRO de #root a propósito: cuando
         ReactDOM.createRoot(...).render(<App/>) corre (ver src/main.jsx), reemplaza todo
         el contenido de #root de un golpe — no hace falta JS extra para quitar esto. -->
    <style>
      #carga-inicial {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #1D4ED8;
      }
      #carga-inicial .halo {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
      }
      #carga-inicial .anillo {
        position: absolute;
        width: 84px;
        height: 84px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        animation: ci-pulso 1.8s ease-out infinite;
      }
      #carga-inicial .pin {
        width: 72px;
        height: 72px;
        animation: ci-caida 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #carga-inicial .marca {
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        opacity: 0;
        animation: ci-aparecer 0.6s ease-out 0.35s forwards;
      }
      #carga-inicial .puntos {
        display: flex;
        gap: 6px;
        opacity: 0;
        animation: ci-aparecer 0.6s ease-out 0.55s forwards;
      }
      #carga-inicial .puntos span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        animation: ci-rebote 1.2s ease-in-out infinite;
      }
      #carga-inicial .puntos span:nth-child(2) { animation-delay: 0.15s; }
      #carga-inicial .puntos span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes ci-caida {
        from { transform: translateY(-36px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes ci-pulso {
        from { transform: scale(0.6); opacity: 0.8; }
        to { transform: scale(1.9); opacity: 0; }
      }
      @keyframes ci-aparecer {
        from { transform: translateY(6px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes ci-rebote {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-5px); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #carga-inicial .pin, #carga-inicial .anillo, #carga-inicial .marca, #carga-inicial .puntos, #carga-inicial .puntos span {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="carga-inicial" role="status" aria-label="Cargando TuMuniAquí">
        <div class="halo">
          <div class="anillo"></div>
          <svg class="pin" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C7.58 2 4 5.58 4 10c0 5.25 8 12 8 12s8-6.75 8-12c0-4.42-3.58-8-8-8z" fill="#ffffff" />
            <circle cx="12" cy="10" r="3" fill="#1D4ED8" />
          </svg>
        </div>
        <p class="marca">TuMuniAquí</p>
        <div class="puntos"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
