<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: necesario para que env(safe-area-inset-bottom) valga
         algo y la barra inferior no quede bajo el indicador de gestos del iPhone.
         Se quitaron "maximum-scale=1.0, user-scalable=no": bloquear el zoom es
         una barrera de accesibilidad real (WCAG 1.4.4) para vecinos mayores o con
         baja visión, que son parte del público de esta app. El efecto secundario
         que esos flags evitaban —iOS hace zoom al enfocar un input de menos de
         16px— se resuelve con el tamaño de fuente de los campos, no capando el
         zoom de todos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D4ED8" />
    <title>TuMuniAquí</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TuMuniAquí" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
