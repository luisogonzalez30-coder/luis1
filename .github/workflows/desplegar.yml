# Publica el sitio en Firebase Hosting automáticamente.
#
# Dos comportamientos, en un solo archivo:
#
#   1. Al abrir o actualizar un Pull Request  → publica una VISTA PREVIA en una
#      URL temporal y la deja como comentario en el PR. Sirve para mirar los
#      cambios antes de que los vean los vecinos. Se borra sola a los 7 días.
#
#   2. Al hacer merge a "main"                → publica en el sitio real,
#      https://app-incidencias-urbanas.web.app
#
# Requisito único: el secreto FIREBASE_SERVICE_ACCOUNT en el repositorio.
# Cómo crearlo está en DESPLEGAR.md, sección "Despliegue automático".

name: Desplegar sitio

on:
  push:
    branches: [main]
  pull_request:

# Si se empujan dos commits seguidos, cancela el despliegue viejo en vez de
# encolar los dos: publicar una versión ya superada solo confunde.
concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest

    # Los Pull Requests que vienen de un fork NO reciben los secretos del
    # repositorio (GitHub los bloquea a propósito: si no, cualquiera podría
    # abrir un PR que imprima tu credencial de Firebase). Sin secretos el
    # despliegue fallaría igual, así que se salta en vez de dejar un error rojo
    # confuso. Los PR de este mismo repositorio —el caso normal acá— sí corren.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      checks: write
      pull-requests: write   # para dejar la URL de vista previa como comentario

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        # npm ci (no npm install): instala exactamente las versiones del
        # package-lock.json, así lo que se publica es lo mismo que se probó.
        run: npm ci

      - name: Compilar
        # Estas variables se incrustan en el bundle durante el build. Ojo: la
        # configuración web de Firebase NO es secreta —viaja en el JavaScript
        # que recibe cualquier visitante, y quien protege los datos son las
        # reglas de Firestore, no ocultar estas claves. Van como secretos de
        # todos modos para no tener que commitear el .env.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: npm run build

      - name: Comprobar que el build no salió vacío
        # Una variable de entorno mal escrita puede dar un build que compila
        # pero no sirve. Es preferible fallar acá que publicar un sitio roto.
        run: |
          test -f dist/index.html || { echo "No se generó dist/index.html"; exit 1; }
          ls dist/assets/index-*.js >/dev/null || { echo "No se generó el bundle"; exit 1; }

      # --- Vista previa (Pull Requests) ------------------------------------
      - name: Publicar vista previa
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: app-incidencias-urbanas
          expires: 7d

      # --- Sitio real (merge a main) ---------------------------------------
      - name: Publicar en producción
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: app-incidencias-urbanas
          channelId: live
