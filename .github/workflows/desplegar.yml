# Publica el sitio en Firebase Hosting automáticamente.
#
# Dos comportamientos, en un solo archivo:
#
#   1. Al abrir o actualizar un Pull Request  → publica una VISTA PREVIA en una
#      URL temporal y la deja como comentario en el PR. Sirve para mirar los
#      cambios antes de que los vean los vecinos. Se borra sola a los 7 días.
#
#   2. Al hacer merge a "main"                → publica en el sitio real,
#      https://app-incidencias-urbanas.web.app
#
# Requisito único: el secreto FIREBASE_SERVICE_ACCOUNT en el repositorio.
# Cómo crearlo está en DESPLEGAR.md, sección "Despliegue automático".

name: Desplegar sitio

on:
  push:
    branches: [main]
    # Publicar en producción tiene que significar que algo cambió de verdad.
    # Estos archivos no entran en la compilación —Firebase sirve solo dist/, y
    # nada en src/ importa un .md— así que republicar el sitio de un municipio
    # en funcionamiento por una nota o una guía es riesgo sin contraparte.
    #
    # GitHub omite la corrida solo si TODOS los archivos del cambio calzan con
    # esta lista: código acompañado de documentación despliega igual, y tocar
    # este mismo workflow también, porque no es un .md.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      # CondominioAquí es otro producto, con su propio proyecto de Firebase y su
      # propio workflow (desplegar-condominioaqui.yml). Sin esta línea, tocar un
      # archivo de esa carpeta republicaría el sitio del municipio sin que nada
      # suyo hubiera cambiado.
      - 'condominioaqui/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'condominioaqui/**'

# Si se empujan dos commits seguidos, cancela el despliegue viejo en vez de
# encolar los dos: publicar una versión ya superada solo confunde.
concurrency:
  group: desplegar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest

    # Los Pull Requests que vienen de un fork NO reciben los secretos del
    # repositorio (GitHub los bloquea a propósito: si no, cualquiera podría
    # abrir un PR que imprima tu credencial de Firebase). Sin secretos el
    # despliegue fallaría igual, así que se salta en vez de dejar un error rojo
    # confuso. Los PR de este mismo repositorio —el caso normal acá— sí corren.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      checks: write
      pull-requests: write   # para dejar la URL de vista previa como comentario

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        # npm ci (no npm install): instala exactamente las versiones del
        # package-lock.json, así lo que se publica es lo mismo que se probó.
        run: npm ci

      # Vite NO falla cuando falta un VITE_*: lo reemplaza por undefined y compila
      # igual. El sitio se publica, pero firebase.js revienta con
      # "auth/invalid-api-key" al evaluarse el modulo, React nunca monta y el
      # vecino se queda mirando la pantalla de carga para siempre. Paso de verdad
      # en el primer despliegue automatico, y lo peor es que la CI estaba verde.
      # Por eso se comprueba antes de compilar y se falla nombrando lo que falta.
      - name: Comprobar la configuracion antes de compilar
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
        shell: bash
        run: |
          faltan=""
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                   VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET \
                   VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
                   VITE_CLOUDINARY_CLOUD_NAME VITE_CLOUDINARY_UPLOAD_PRESET; do
            # ${!v} es expansion indirecta de bash: toma el valor de la
            # variable cuyo nombre esta en $v. Se comprueba el valor sin
            # imprimirlo nunca — al registro solo llega el nombre.
            # El //[[:space:]]/ descarta un secreto que quedo con solo espacios
            # o un salto de linea pegado al copiar: para Vite eso es tan
            # inservible como no tenerlo.
            if [ -z "${!v//[[:space:]]/}" ]; then
              faltan="$faltan $v"
            fi
          done

          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos de configuracion:$faltan"
            {
              echo "### Faltan secretos de configuracion"
              echo ""
              echo "No se compilo nada. Estos secretos estan vacios o no existen:"
              echo ""
              for v in $faltan; do echo "- \`$v\`"; done
              echo ""
              echo "Crealos en Settings -> Secrets and variables -> Actions."
              echo "Los valores salen del archivo .env. Ver DESPLEGAR.md, paso 3."
              echo ""
              echo "Sin ellos el sitio compila pero queda muerto: firebase.js lanza"
              echo "auth/invalid-api-key al cargar y la app no llega a montarse."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Los 8 secretos de configuracion estan presentes."

      - name: Compilar
        # Estas variables se incrustan en el bundle durante el build. Ojo: la
        # configuración web de Firebase NO es secreta —viaja en el JavaScript
        # que recibe cualquier visitante, y quien protege los datos son las
        # reglas de Firestore, no ocultar estas claves. Van como secretos de
        # todos modos para no tener que commitear el .env.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_USE_FIREBASE_EMULATORS: 'false'
        run: npm run build

      - name: Comprobar que el build no salió vacío
        # Una variable de entorno mal escrita puede dar un build que compila
        # pero no sirve. Es preferible fallar acá que publicar un sitio roto.
        run: |
          test -f dist/index.html || { echo "No se generó dist/index.html"; exit 1; }
          ls dist/assets/index-*.js >/dev/null || { echo "No se generó el bundle"; exit 1; }

      # --- ¿Está la credencial? --------------------------------------------
      # Sin este chequeo, cuando falta el secreto la accion de Firebase revienta
      # con "Input required and not supplied: firebaseServiceAccount" y el PR
      # queda en rojo — como si el codigo estuviera roto, cuando en realidad
      # compila perfecto y lo unico que falta es una credencial. Un rojo que
      # miente entrena a ignorar la CI.
      - name: Ver si hay credencial de publicacion
        id: credencial
        env:
          CUENTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_INCIDENCIAS_URBANAS || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CUENTA" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      # --- Vista previa (Pull Requests) ------------------------------------
      - name: Publicar vista previa
        if: github.event_name == 'pull_request' && steps.credencial.outputs.hay == 'si'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_INCIDENCIAS_URBANAS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: app-incidencias-urbanas
          expires: 7d

      # En un PR la vista previa es un extra: si falta la credencial se avisa y
      # se sigue. El build ya demostro que el codigo esta sano, que es lo que
      # el PR necesita comprobar.
      - name: Avisar que no hay vista previa
        if: github.event_name == 'pull_request' && steps.credencial.outputs.hay == 'no'
        run: |
          {
            echo "### Vista previa no publicada"
            echo ""
            echo "El codigo compila bien, pero falta la credencial para publicar."
            echo ""
            echo "Crea el secreto **FIREBASE_SERVICE_ACCOUNT** en"
            echo "Settings -> Secrets and variables -> Actions, pegando el JSON"
            echo "completo de la clave de la cuenta de servicio github-desplegador."
            echo ""
            echo "Paso a paso en DESPLEGAR.md. En cuanto exista, el siguiente"
            echo "commit publica la vista previa solo."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Sin credencial: se omite la vista previa (el build si paso)."

      # --- Sitio real (merge a main) ---------------------------------------
      - name: Publicar en produccion
        if: github.event_name == 'push' && steps.credencial.outputs.hay == 'si'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APP_INCIDENCIAS_URBANAS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: app-incidencias-urbanas
          channelId: live

      # En main SI se falla a proposito. Omitir en silencio dejaria creyendo que
      # el sitio se actualizo cuando no paso nada — que es exactamente el
      # malentendido que ya costo varias vueltas (ver RETOMAR-AQUI.md).
      - name: Falta la credencial para publicar
        if: github.event_name == 'push' && steps.credencial.outputs.hay == 'no'
        run: |
          echo "::error::No se publico nada: falta el secreto FIREBASE_SERVICE_ACCOUNT."
          echo "El sitio sigue con la version anterior. Ver DESPLEGAR.md."
          exit 1
