services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: centinela
      POSTGRES_PASSWORD: centinela_dev
      POSTGRES_DB: centinela_ta
    ports:
      - "5432:5432"
    volumes:
      - centinela_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centinela -d centinela_ta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  centinela_pg_data:
